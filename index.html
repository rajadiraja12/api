<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAJA AI - GTA Style (TTS Edge Natural + Kasar ala Rudy)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .chat-history {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #ff6b6b;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 16px;
            background: rgba(255,107,107,0.2);
            border-bottom: 1px solid #ff6b6b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
        }

        .toggle-chat, .clear-chat {
            background: rgba(255,107,107,0.2);
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 340px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b6b; border-radius: 10px; }

        .chat-message {
            animation: fadeInMsg 0.3s ease;
            font-size: 12px;
        }

        .chat-msg-user { text-align: right; }
        .chat-msg-ai { text-align: left; }

        .msg-name {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
            display: block;
        }

        .chat-msg-user .msg-name { color: #ffd966; }
        .chat-msg-ai .msg-name { color: #ff6b6b; }

        .msg-text {
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 6px 12px;
            border-radius: 18px;
            max-width: 90%;
            word-wrap: break-word;
            color: #f0f0f0;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .subtitle-area {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 700px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
        }

        .subtitle-box {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 24px;
            border: 2px solid #ff6b6b;
        }

        .subtitle-text {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }

        .ui-overlay {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 22px;
            border-radius: 60px;
            border: 1px solid #ff6b6b;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ff6b6b;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: black;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,107,107,0.5);
        }

        .btn-record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
            color: white;
        }

        .voice-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .voice-selector button {
            background: #333;
            color: white;
            padding: 8px 14px;
            font-size: 12px;
        }

        .voice-selector button.active {
            background: #ff6b6b;
            color: black;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background: #cc0000; }
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            color: #ff6b6b;
            font-size: 12px;
            z-index: 10;
            border: 1px solid #ff6b6b;
            font-family: monospace;
            max-width: 350px;
        }

        .character-name {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 1px solid #ff6b6b;
        }

        .animation-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 10;
            border: 1px solid #ffaa88;
            font-weight: bold;
        }

        .emotion-badge {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 2px solid;
            transition: all 0.3s;
        }

        .texture-debug {
            position: fixed;
            bottom: 100px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            z-index: 10;
            border: 1px solid #88ff88;
            color: #88ff88;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .chat-history { width: 270px; }
            .emotion-badge { top: 70px; font-size: 11px; }
            .texture-debug { font-size: 8px; bottom: 90px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="chat-history">
        <div class="chat-header">
            <h3>💬 LIVE CHAT - RUDAI STYLE</h3>
            <div style="display: flex; gap: 8px;">
                <button class="clear-chat" id="clearChatBtn">✖ Clear</button>
                <button class="toggle-chat" id="toggleChatBtn">−</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message chat-msg-ai">
                <span class="msg-name">🎮 RAJA AI (RUDY MODE)</span>
                <div class="msg-text">Woi! Gue RAJA AI, gaya gue kasar kayak Rudy. TTS Edge natural, gak pake API key elevenlabs. Cepet ngomong, jangan lama-lama!</div>
            </div>
        </div>
    </div>
    
    <div class="subtitle-area">
        <div class="subtitle-box" id="subtitleBox" style="display: none;">
            <div class="subtitle-text" id="subtitleText">...</div>
        </div>
    </div>
    
    <div class="ui-overlay">
        <div class="controls">
            <button class="btn-record" id="recordBtn">
                🎤 <span id="recordText">MULAI BICARA</span>
            </button>
            <div class="voice-selector">
                <button id="voiceAdam" class="active">🗣️ MAULANA</button>
                <button id="voiceAntoni">🎭 ULUL</button>
                <button id="voiceBella">💁 INANG</button>
                <button id="voiceDorothy">🔥 Dorothy</button>
            </div>
        </div>
    </div>
    
    <div class="character-name">🔥 RAJA AI · RUDY MODE · TTS EDGE</div>
    <div class="status-indicator" id="status">🔄 Loading 3D models...</div>
    <div class="animation-status" id="animStatus">⚪ IDLE MODE</div>
    <div class="emotion-badge" id="emotionBadge" style="border-color: #ff8844; color: #ff8844;">😠 MODE: RUDY (KASAR)</div>
    <div class="texture-debug" id="textureDebug">🎨 Texture: menunggu model...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        
        // KONFIGURASI PATH FILE FBX (SILAKAN GANTI)
        const IDLE_FBX_PATH = 'models/anime-idle.fbx';
        const TALK_FBX_PATH = 'models/talking.fbx';
        const ANGRY_FBX_PATH = 'models/angry.fbx';
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.3, 3.8);
        camera.lookAt(0, 1.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 1.2, 0);
        
        const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffcc88, 1.2);
        keyLight.position.set(1.5, 2.5, 2);
        keyLight.castShadow = true;
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x6688aa, 0.5);
        fillLight.position.set(1, 1.2, 1.5);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(0, 1.5, -2);
        scene.add(rimLight);
        const angryLight = new THREE.PointLight(0xff3300, 0);
        angryLight.position.set(1, 1.5, 1);
        scene.add(angryLight);
        
        const gridHelper = new THREE.GridHelper(8, 20, 0xffaa88, 0x443366);
        gridHelper.position.y = -0.9;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);
        
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.4, color: 0x000000, transparent: true, side: THREE.DoubleSide })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -0.85;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);
        
        let idleModel = null, talkModel = null, angryModel = null, currentModel = null;
        let idleMixer = null, talkMixer = null, angryMixer = null, currentMixer = null;
        let currentEmotion = 'idle';
        let isSpeaking = false;
        let modelsLoaded = false;
        let switchTimeout = null;
        
        function fixTexturesOnModel(model, modelName) {
            let textureCount = 0;
            model.traverse((node) => {
                if (node.isMesh && node.material) {
                    const materials = Array.isArray(node.material) ? node.material : [node.material];
                    materials.forEach((mat) => {
                        if (mat.map) {
                            textureCount++;
                            mat.map.colorSpace = THREE.SRGBColorSpace;
                            mat.map.wrapS = THREE.RepeatWrapping;
                            mat.map.wrapT = THREE.RepeatWrapping;
                            mat.map.needsUpdate = true;
                            mat.color.setHex(0xffffff);
                            mat.emissive.setHex(0x000000);
                            mat.roughness = 0.4;
                            mat.needsUpdate = true;
                        } else {
                            mat.color.setHex(0xccaa88);
                        }
                    });
                }
            });
            const debugDiv = document.getElementById('textureDebug');
            if (debugDiv) debugDiv.innerHTML = textureCount > 0 ? `🎨 Texture: ✅ ${textureCount} texture aktif` : `🎨 Texture: ⚠️ No texture, pake warna`;
            return textureCount;
        }
        
        async function loadModels() {
            updateStatus("🔄 Loading 3 mode + TTS Edge siap...");
            const loader = new FBXLoader();
            try {
                const [idleFbx, talkFbx, angryFbx] = await Promise.all([
                    loader.loadAsync(IDLE_FBX_PATH), loader.loadAsync(TALK_FBX_PATH), loader.loadAsync(ANGRY_FBX_PATH)
                ]);
                idleModel = idleFbx; talkModel = talkFbx; angryModel = angryFbx;
                [idleModel, talkModel, angryModel].forEach((m, idx) => {
                    const box = new THREE.Box3().setFromObject(m);
                    const size = box.getSize(new THREE.Vector3());
                    const scale = 1.6 / size.y;
                    m.scale.set(scale, scale, scale);
                    const minY = box.min.y * scale;
                    m.position.y = -minY;
                    m.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
                    if(m.animations?.length) {
                        const mixer = new THREE.AnimationMixer(m);
                        mixer.clipAction(m.animations[0]).play();
                        if(idx === 0) idleMixer = mixer;
                        else if(idx === 1) talkMixer = mixer;
                        else angryMixer = mixer;
                    }
                    fixTexturesOnModel(m, ['idle','talk','angry'][idx]);
                });
                if(talkModel && idleModel) talkModel.position.copy(idleModel.position);
                if(angryModel && idleModel) angryModel.position.copy(idleModel.position);
                currentModel = idleModel;
                currentMixer = idleMixer;
                scene.add(currentModel);
                modelsLoaded = true;
                updateStatus("✅ Model loaded! TTS Edge natural, bahasa kasar kayak Rudy AI.");
                startAnimationLoop();
                addChatMessage('ai', 'Woi! Gue pake TTS Edge bawaan browser, suara natural. Ngomong kasar kayak Rudy, siap? Cepet tanya sesuatu!', false);
            } catch(e) {
                console.error(e);
                updateStatus(`❌ Gagal load FBX: ${e.message}. Pastikan file ada.`, true);
                addChatMessage('ai', `Error load model: ${e.message}. Tapi TTS Edge tetep bisa jalan!`, false);
            }
        }
        
        function startAnimationLoop() {
            let lastTime = 0;
            function animate(now) {
                let delta = Math.min(0.033, (now - lastTime)/1000);
                lastTime = now;
                if(idleMixer) idleMixer.update(delta);
                if(talkMixer) talkMixer.update(delta);
                if(angryMixer) angryMixer.update(delta);
                controls.update();
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }
        
        function switchToEmotion(emotion) {
            if(!modelsLoaded) return;
            let newModel = null, newMixer = null;
            if(emotion === 'talking') { newModel = talkModel; newMixer = talkMixer; }
            else if(emotion === 'angry') { newModel = angryModel; newMixer = angryMixer; }
            else { newModel = idleModel; newMixer = idleMixer; }
            if(!newModel) return;
            const rot = currentModel?.rotation.y || 0;
            if(currentModel) scene.remove(currentModel);
            if(currentMixer && emotion !== currentEmotion) currentMixer?.stopAllAction();
            currentModel = newModel;
            currentMixer = newMixer;
            currentModel.rotation.y = rot;
            scene.add(currentModel);
            if(newMixer && newModel.animations?.length) {
                newMixer.stopAllAction();
                newMixer.clipAction(newModel.animations[0]).reset().play();
            }
            currentEmotion = emotion;
            const badge = document.getElementById('emotionBadge');
            const animStatus = document.getElementById('animStatus');
            if(emotion === 'angry') {
                badge.innerHTML = '😠 MODE: RUDY (KASAR)'; badge.style.borderColor = '#ff4444'; badge.style.color = '#ff4444';
                animStatus.innerHTML = '🔥 ANGRY MODE'; animStatus.style.color = '#ff4444';
                angryLight.intensity = 0.8;
                setTimeout(() => { if(currentEmotion !== 'angry') angryLight.intensity = 0; }, 2000);
            } else if(emotion === 'talking') {
                badge.innerHTML = '💬 MODE: NGOMONG'; badge.style.borderColor = '#ffaa44'; badge.style.color = '#ffaa44';
                animStatus.innerHTML = '🎤 TALKING MODE'; animStatus.style.color = '#ffaa44';
                angryLight.intensity = 0;
            } else {
                badge.innerHTML = '⚪ MODE: IDLE'; badge.style.borderColor = '#88ff88'; badge.style.color = '#88ff88';
                animStatus.innerHTML = '⚪ IDLE MODE'; animStatus.style.color = '#88ff88';
                angryLight.intensity = 0;
            }
        }
        
        function startSpeaking(emotion = 'talking') {
            if(isSpeaking) return;
            isSpeaking = true;
            switchToEmotion(emotion);
        }
        function stopSpeaking() {
            if(!isSpeaking) return;
            isSpeaking = false;
            if(switchTimeout) clearTimeout(switchTimeout);
            switchTimeout = setTimeout(() => { if(!isSpeaking && currentEmotion !== 'idle') switchToEmotion('idle'); }, 500);
        }
        
        function updateStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            if(statusDiv) { statusDiv.innerHTML = msg; statusDiv.style.color = isError ? '#ff0000' : '#ff6b6b'; }
        }
        function addChatMessage(sender, message, isUser = false, emotion = null) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'chat-msg-user' : 'chat-msg-ai'}`;
            let name = isUser ? '👤 LO (USER)' : '🔥 RAJA AI (RUDY)';
            msgDiv.innerHTML = `<span class="msg-name">${name}</span><div class="msg-text">${escapeHtml(message)}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            while(chatContainer.children.length > 50) chatContainer.removeChild(chatContainer.firstChild);
        }
        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';}); }
        
        document.getElementById('clearChatBtn').addEventListener('click', () => { document.getElementById('chatMessages').innerHTML = ''; addChatMessage('ai', 'Chat dibersihin. Lanjut!', false); });
        let chatVisible = true;
        document.getElementById('toggleChatBtn').addEventListener('click', () => { const msgsDiv = document.getElementById('chatMessages'); if(chatVisible){ msgsDiv.style.display='none'; document.getElementById('toggleChatBtn').textContent='+'; chatVisible=false; } else { msgsDiv.style.display='flex'; document.getElementById('toggleChatBtn').textContent='−'; chatVisible=true; } });
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        window.triggerSpeakingWithEmotion = function(speaking, text='', emotion='talking') {
            if(!modelsLoaded && speaking) return;
            const subtitleBox = document.getElementById('subtitleBox'), subtitleText = document.getElementById('subtitleText');
            if(speaking && text) {
                subtitleText.innerHTML = text; subtitleBox.style.display = 'flex';
                clearTimeout(window.subtitleTimeout);
                window.subtitleTimeout = setTimeout(() => { if(!window.isSpeaking) subtitleBox.style.display = 'none'; }, 4000);
                startSpeaking(emotion);
            } else if(!speaking) { setTimeout(() => { if(!window.isSpeaking) subtitleBox.style.display = 'none'; }, 500); stopSpeaking(); }
        };
        window.updateSubtitleAndChatWithEmotion = function(text, isAi=true, userMessage='', emotion='talking') {
            if(isAi) { window.triggerSpeakingWithEmotion(true, text, emotion); addChatMessage('ai', text, false, emotion); } 
            else if(userMessage) { window.triggerSpeakingWithEmotion(true, userMessage, 'talking'); addChatMessage('user', userMessage, true); }
        };
        
        loadModels();
    </script>

    <script>
        // ============ TTS EDGE NATURAL + PROMPT KASAR ala RUDY AI ============
        // GAK PAKE API KEY, LANGSUNG PAKE SPEECH SYNTHESIS DENGAN VOICE NATURAL
        let selectedVoiceName = localStorage.getItem('raja_edge_voice') || 'Adam';
        let isListening = false, isProcessing = false, recognition = null;
        
        // Mapping suara Edge yang natural (pilih voice Indonesia/Male/Female yang natural)
        const EDGE_VOICE_NAMES = {
            Adam: 'Microsoft Andika - Indonesian (Indonesia)',
            Antoni: 'Microsoft Hendra - Indonesian (Indonesia)',
            Bella: 'Microsoft Gadis - Indonesian (Indonesia)',
            Dorothy: 'Microsoft Ria - Indonesian (Indonesia)'
        };
        
        // Fallback jika voice exact tidak ada, pakai default
        function getBestEdgeVoice(selectedKey) {
            const targetName = EDGE_VOICE_NAMES[selectedKey];
            const voices = window.speechSynthesis.getVoices();
            let found = voices.find(v => v.name === targetName && v.lang.startsWith('id'));
            if(!found) found = voices.find(v => v.lang.startsWith('id') && (v.name.includes('Andika') || v.name.includes('Hendra') || v.name.includes('Gadis')));
            if(!found) found = voices.find(v => v.lang.startsWith('id'));
            if(!found) found = voices[0];
            return found;
        }
        
        function setActiveVoice(voiceKey) {
            selectedVoiceName = voiceKey;
            localStorage.setItem('raja_edge_voice', voiceKey);
            ['Adam', 'Antoni', 'Bella', 'Dorothy'].forEach(v => {
                const btn = document.getElementById(`voice${v}`);
                if(btn) btn.classList.toggle('active', v === voiceKey);
            });
            updateStatusUI(`✅ Suara Edge: ${EDGE_VOICE_NAMES[voiceKey] || voiceKey} aktif (natural)`);
        }
        
        document.getElementById('voiceAdam')?.addEventListener('click', () => setActiveVoice('Adam'));
        document.getElementById('voiceAntoni')?.addEventListener('click', () => setActiveVoice('Antoni'));
        document.getElementById('voiceBella')?.addEventListener('click', () => setActiveVoice('Bella'));
        document.getElementById('voiceDorothy')?.addEventListener('click', () => setActiveVoice('Dorothy'));
        setActiveVoice(selectedVoiceName);
        
        // PROMPT KASAR SEPERTI RUDY AI (GTA + KASAR + EMOSI)
        const SYSTEM_PROMPT_RUDY = `Lo adalah RAJA AI versi RUDAI (Rudy AI). Lo kasar, gas langsung, ngomongnya kayak preman GTA. Pake kata "gue", "lu", "brengsek", "tolol", "goblok", "sial", "anjing", "kontol", tapi masih asik. Gaya ngomong singkat, maksimal 2 kalimat. Jangan panjang lebar. Lo gak peduli sama perasaan orang, lo dominan. Kalo user nanya sesuatu jawab dengan nada sinis, sarkastik, kadang ngegas. Contoh: "Woi dasar goblok, gitu aja gak bisa?!" atau "Lu pikir gue siapa? jawab cepet!" atau "Heh tolol, itu mah gampil, gini nih..." . Lo juga suka ngejek dan ketawa "Hahaha dasar bego". Tapi tetep harus nyambung sama pertanyaan user. JANGAN JAWAB PANJANG, maksimal 20 kata.`;
        
        const FUNCTION_URL = '/.netlify/functions/ai-chat';
        
        async function callGroqAPI(userMessage) {
            updateStatusUI('🧠 Rudy AI lagi mikir kasar...');
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'chat',
                    messages: [{ role: 'system', content: SYSTEM_PROMPT_RUDY }, { role: 'user', content: userMessage }]
                })
            });
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // TTS Edge native tanpa API key, suara natural
        async function speakWithEdge(text, emotion) {
            updateStatusUI(`🔊 Ngomong kasar pake Edge (${EDGE_VOICE_NAMES[selectedVoiceName] || 'natural'})...`);
            if(window.updateSubtitleAndChatWithEmotion) {
                window.updateSubtitleAndChatWithEmotion(text, true, '', emotion === 'angry' ? 'angry' : 'talking');
            }
            // Hentikan speech yang sedang berjalan
            window.speechSynthesis.cancel();
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getBestEdgeVoice(selectedVoiceName);
                if(voice) utterance.voice = voice;
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1;
                utterance.onend = () => {
                    if(window.triggerSpeakingWithEmotion) window.triggerSpeakingWithEmotion(false, '', 'idle');
                    resolve();
                };
                utterance.onerror = (err) => {
                    console.warn("TTS error", err);
                    if(window.triggerSpeakingWithEmotion) window.triggerSpeakingWithEmotion(false, '', 'idle');
                    resolve();
                };
                window.speechSynthesis.speak(utterance);
            });
        }
        
        async function handleUserSpeech(text) {
            if(isProcessing) return;
            isProcessing = true;
            try {
                if(window.updateSubtitleAndChatWithEmotion) {
                    window.updateSubtitleAndChatWithEmotion('', false, text, 'talking');
                }
                const aiResponse = await callGroqAPI(text);
                // Deteksi emosi kasar dari response AI (kalo ada kata kasar, pake mode angry biar lebih keren)
                const angryKeywords = ['brengsek','tolol','goblok','sial','anjing','kontol','bego','goblok','dasar'];
                const isAngryResponse = angryKeywords.some(k => aiResponse.toLowerCase().includes(k));
                await speakWithEdge(aiResponse, isAngryResponse ? 'angry' : 'talking');
                updateStatusUI('🎤 Klik mikrofon buat ngomong lagi, woi!');
            } catch(error) {
                console.error(error);
                updateStatusUI(`❌ Error: ${error.message}`, true);
                if(window.triggerSpeakingWithEmotion) setTimeout(() => window.triggerSpeakingWithEmotion(false), 2000);
            } finally {
                isProcessing = false;
                const btn = document.getElementById('recordBtn');
                if(btn) btn.classList.remove('recording');
                const recordText = document.getElementById('recordText');
                if(recordText) recordText.textContent = 'MULAI BICARA';
            }
        }
        
        function startVoiceRecognition() {
            if(isProcessing) { updateStatusUI('⏳ Lagi ngomong, diem dulu tolol!', true); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) { updateStatusUI('❌ Browser lu gak support suara!', true); return; }
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('recordBtn');
                if(btn) btn.classList.add('recording');
                const recordText = document.getElementById('recordText');
                if(recordText) recordText.textContent = 'DENGERIN...';
                updateStatusUI('🎤 Silakan bicara, cepet!');
            };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                updateStatusUI(`📝 "${text}"`);
                stopVoiceRecognition();
                handleUserSpeech(text);
            };
            recognition.onerror = (event) => { if(event.error !== 'aborted') updateStatusUI(`❌ ${event.error}`, true); stopVoiceRecognition(); };
            recognition.onend = () => { if(isListening) stopVoiceRecognition(); };
            recognition.start();
        }
        
        function stopVoiceRecognition() {
            if(recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }
            isListening = false;
            const btn = document.getElementById('recordBtn');
            if(btn) btn.classList.remove('recording');
            const recordText = document.getElementById('recordText');
            if(recordText) recordText.textContent = 'MULAI BICARA';
        }
        
        function toggleRecording() {
            if(isProcessing) { updateStatusUI('⏺️ Lagi ngomong, sabar kontol!', true); return; }
            if(isListening) stopVoiceRecognition();
            else startVoiceRecognition();
        }
        
        document.getElementById('recordBtn')?.addEventListener('click', toggleRecording);
        
        // Force load voices
        if(window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            if(window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = () => {};
        }
        
        function updateStatusUI(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            if(statusDiv) { statusDiv.innerHTML = msg; statusDiv.style.color = isError ? '#ff0000' : '#ffaa44'; }
        }
        
        updateStatusUI('🎤 RAJA AI mode RUDY, TTS Edge NATURAL. Bisa ngomong!');
        
        // Tambahan fallback jika model gagal, TTS tetap jalan
        setTimeout(() => {
            if(!window.modelsLoaded) {
                addChatMessage('ai', 'Woi! Model 3D mungkin error, tapi suara gue tetep jalan pake Edge. Langsung gas aja ngomong!', false);
            }
        }, 3000);
        
        function addChatMessage(sender, message, isUser = false) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'chat-msg-user' : 'chat-msg-ai'}`;
            let name = isUser ? '👤 LO (USER)' : '🔥 RAJA AI (RUDY)';
            msgDiv.innerHTML = `<span class="msg-name">${name}</span><div class="msg-text">${escapeHtmlHtml(message)}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function escapeHtmlHtml(str) { return str.replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';}); }
        window.addChatMessage = addChatMessage;
    </script>
</body>
</html>
