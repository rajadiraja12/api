<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAJA AI - GTA San Andreas Style (3 Mode: Idle/Talk/Angry)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .chat-history {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #ff6b6b;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 16px;
            background: rgba(255,107,107,0.2);
            border-bottom: 1px solid #ff6b6b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
        }

        .toggle-chat, .clear-chat {
            background: rgba(255,107,107,0.2);
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 340px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b6b; border-radius: 10px; }

        .chat-message {
            animation: fadeInMsg 0.3s ease;
            font-size: 12px;
        }

        .chat-msg-user { text-align: right; }
        .chat-msg-ai { text-align: left; }

        .msg-name {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
            display: block;
        }

        .chat-msg-user .msg-name { color: #ffd966; }
        .chat-msg-ai .msg-name { color: #ff6b6b; }

        .msg-text {
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 6px 12px;
            border-radius: 18px;
            max-width: 90%;
            word-wrap: break-word;
            color: #f0f0f0;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .subtitle-area {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 700px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
        }

        .subtitle-box {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 24px;
            border: 2px solid #ff6b6b;
        }

        .subtitle-text {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }

        .ui-overlay {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 22px;
            border-radius: 60px;
            border: 1px solid #ff6b6b;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ff6b6b;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: black;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,107,107,0.5);
        }

        .btn-record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
            color: white;
        }

        .voice-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .voice-selector button {
            background: #333;
            color: white;
            padding: 8px 14px;
            font-size: 12px;
        }

        .voice-selector button.active {
            background: #ff6b6b;
            color: black;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background: #cc0000; }
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            color: #ff6b6b;
            font-size: 12px;
            z-index: 10;
            border: 1px solid #ff6b6b;
            font-family: monospace;
            max-width: 350px;
        }

        .character-name {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 1px solid #ff6b6b;
        }

        .animation-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 10;
            border: 1px solid #ffaa88;
            font-weight: bold;
        }

        .emotion-badge {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 2px solid;
            transition: all 0.3s;
        }

        @media (max-width: 768px) {
            .chat-history { width: 270px; }
            .emotion-badge { top: 70px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="chat-history">
        <div class="chat-header">
            <h3>💬 LIVE CHAT</h3>
            <div style="display: flex; gap: 8px;">
                <button class="clear-chat" id="clearChatBtn">✖ Clear</button>
                <button class="toggle-chat" id="toggleChatBtn">−</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message chat-msg-ai">
                <span class="msg-name">🎮 RAJA AI</span>
                <div class="msg-text">Yo! Loading karakter 3D dengan 3 mode ekspresi: santai, ngobrol, dan marah!</div>
            </div>
        </div>
    </div>
    
    <div class="subtitle-area">
        <div class="subtitle-box" id="subtitleBox" style="display: none;">
            <div class="subtitle-text" id="subtitleText">...</div>
        </div>
    </div>
    
    <div class="ui-overlay">
        <div class="controls">
            <button class="btn-record" id="recordBtn">
                🎤 <span id="recordText">MULAI BICARA</span>
            </button>
            <div class="voice-selector">
                <button id="voiceAdam" class="active">🗣️ MAULANA</button>
                <button id="voiceAntoni">🎭 ULUL</button>
                <button id="voiceBella">💁 INANG</button>
                <button id="voiceDorothy">🔥 SITI</button>
            </div>
            <button id="forceAngryBtn" style="background:#ff4444;">😠 FORCE ANGRY</button>
            <button id="forceIdleBtn" style="background:#44ff44;">😊 FORCE IDLE</button>
        </div>
    </div>
    
    <div class="character-name">🎮 RAJA AI · GTA STYLE</div>
    <div class="status-indicator" id="status">🔄 Loading 3D models...</div>
    <div class="animation-status" id="animStatus">⚪ IDLE MODE</div>
    <div class="emotion-badge" id="emotionBadge" style="border-color: #88ff88; color: #88ff88;">😊 MODE: SANTAI</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        
        // ============ KONFIGURASI PATH FILE FBX ============
        // GANTI PATH INI SESUAI DENGAN LOKASI FILE FBX ANDA
        const IDLE_FBX_PATH = 'models/anime-idle.fbx';
        const TALK_FBX_PATH = 'models/talking.fbx';
        const ANGRY_FBX_PATH = 'models/angry.fbx';
        // ===================================================
        
        // Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.3, 3.8);
        camera.lookAt(0, 1.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 1.2, 0);
        
        // GTA Style lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffcc88, 1.0);
        keyLight.position.set(1.5, 2.5, 2);
        keyLight.castShadow = true;
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x6688aa, 0.4);
        fillLight.position.set(1, 1.2, 1.5);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(0, 1.5, -2);
        scene.add(rimLight);
        
        // Red light for angry mode
        const angryLight = new THREE.PointLight(0xff3300, 0);
        angryLight.position.set(1, 1.5, 1);
        scene.add(angryLight);
        
        const gridHelper = new THREE.GridHelper(8, 20, 0xffaa88, 0x443366);
        gridHelper.position.y = -0.9;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);
        
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.4, color: 0x000000, transparent: true, side: THREE.DoubleSide })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -0.85;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);
        
        // Model variables
        let idleModel = null;
        let talkModel = null;
        let angryModel = null;
        let currentModel = null;
        let idleMixer = null;
        let talkMixer = null;
        let angryMixer = null;
        let currentMixer = null;
        
        // State management
        let currentEmotion = 'idle'; // 'idle', 'talking', 'angry'
        let isSpeaking = false;
        let modelsLoaded = false;
        let switchTimeout = null;
        let forcedAngryUntil = 0;
        
        // Store original bone rotations
        let originalBoneRotations = new Map();
        let modelOriginalY = 0;
        
        // Emotion keywords untuk deteksi otomatis
        const ANGRY_KEYWORDS = [
            'marah', 'geram', 'kesal', 'jengkel', 'sial', 'brengsek', 'bangsat',
            'tolol', 'bodoh', 'goblok', 'idiot', 'bego', 'dasar', 'kurang ajar',
            'ngentot', 'memek', 'kontol', 'anjing', 'setan', 'kampret',
            'fuck', 'shit', 'damn', 'hell', 'anger', 'mad', 'pissed'
        ];
        
        const CALM_KEYWORDS = [
            'maaf', 'sabar', 'tenang', 'damai', 'senang', 'bahagia'
        ];
        
        // ============ FUNGSI LOAD MODELS ============
        async function loadModels() {
            updateStatus("🔄 Loading 3 mode animations...");
            
            const loader = new FBXLoader();
            
            try {
                const [idleFbx, talkFbx, angryFbx] = await Promise.all([
                    new Promise((resolve, reject) => loader.load(IDLE_FBX_PATH, resolve, undefined, reject)),
                    new Promise((resolve, reject) => loader.load(TALK_FBX_PATH, resolve, undefined, reject)),
                    new Promise((resolve, reject) => loader.load(ANGRY_FBX_PATH, resolve, undefined, reject))
                ]);
                
                // Process all models
                idleModel = idleFbx;
                processModel(idleModel, 'idle');
                
                talkModel = talkFbx;
                processModel(talkModel, 'talk');
                
                angryModel = angryFbx;
                processModel(angryModel, 'angry');
                
                // Sync transforms
                syncModelTransforms();
                
                // Start with idle model
                if (currentModel) scene.remove(currentModel);
                currentModel = idleModel;
                currentMixer = idleMixer;
                scene.add(currentModel);
                
                modelsLoaded = true;
                updateStatus("✅ 3 mode loaded! Santai, Ngobrol, dan Marah siap!");
                updateEmotionUI('idle');
                
                // Start animation loop
                startAnimationLoop();
                
                addChatMessage('ai', 'Yo! Gue sekarang punya 3 mode: santai, ngobrol, dan marah. Coba bikin gue emosi, liat bedanya!', false);
                
            } catch (error) {
                console.error("Error loading models:", error);
                updateStatus(`❌ Gagal load: ${error.message}. Cek path file FBX!`, true);
                addChatMessage('ai', `Error: File FBX tidak ditemukan!\n- ${IDLE_FBX_PATH}\n- ${TALK_FBX_PATH}\n- ${ANGRY_FBX_PATH}`, false);
            }
        }
        
        function processModel(model, type) {
            // Scale to reasonable height
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const targetHeight = 1.6;
            const scale = targetHeight / size.y;
            model.scale.set(scale, scale, scale);
            
            const minY = box.min.y * scale;
            model.position.y = -minY;
            model.position.x = -center.x * scale;
            model.position.z = -center.z * scale;
            modelOriginalY = model.position.y;
            
            // Enable shadows
            model.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
                if (node.isBone) {
                    originalBoneRotations.set(node, {
                        x: node.rotation.x,
                        y: node.rotation.y,
                        z: node.rotation.z
                    });
                }
            });
            
            // Create animation mixer
            if (model.animations && model.animations.length > 0) {
                if (type === 'idle') {
                    idleMixer = new THREE.AnimationMixer(model);
                    idleMixer.clipAction(model.animations[0]).play();
                } else if (type === 'talk') {
                    talkMixer = new THREE.AnimationMixer(model);
                    talkMixer.clipAction(model.animations[0]).play();
                } else if (type === 'angry') {
                    angryMixer = new THREE.AnimationMixer(model);
                    angryMixer.clipAction(model.animations[0]).play();
                }
            }
        }
        
        function syncModelTransforms() {
            if (idleModel && talkModel && angryModel) {
                talkModel.position.copy(idleModel.position);
                talkModel.scale.copy(idleModel.scale);
                talkModel.rotation.copy(idleModel.rotation);
                
                angryModel.position.copy(idleModel.position);
                angryModel.scale.copy(idleModel.scale);
                angryModel.rotation.copy(idleModel.rotation);
            }
        }
        
        // ============ EMOTION SWITCHING ============
        function switchToEmotion(emotion, forceRestart = true) {
            if (!modelsLoaded) return;
            if (currentEmotion === emotion && !forceRestart) return;
            
            let newModel = null;
            let newMixer = null;
            let emotionName = '';
            let borderColor = '';
            let textColor = '';
            let icon = '';
            
            switch(emotion) {
                case 'idle':
                    newModel = idleModel;
                    newMixer = idleMixer;
                    emotionName = 'SANTAI';
                    icon = '😊';
                    borderColor = '#88ff88';
                    textColor = '#88ff88';
                    break;
                case 'talking':
                    newModel = talkModel;
                    newMixer = talkMixer;
                    emotionName = 'NGOBROL';
                    icon = '💬';
                    borderColor = '#ffaa44';
                    textColor = '#ffaa44';
                    break;
                case 'angry':
                    newModel = angryModel;
                    newMixer = angryMixer;
                    emotionName = 'MARAH';
                    icon = '😠';
                    borderColor = '#ff4444';
                    textColor = '#ff4444';
                    break;
                default:
                    return;
            }
            
            if (!newModel) {
                console.warn(`Model for emotion ${emotion} not loaded`);
                return;
            }
            
            const currentRot = currentModel?.rotation.y || 0;
            const currentPos = currentModel?.position.clone() || new THREE.Vector3(0, modelOriginalY, 0);
            
            if (currentModel) scene.remove(currentModel);
            if (currentMixer && forceRestart) currentMixer?.stopAllAction();
            
            currentModel = newModel;
            currentMixer = newMixer;
            currentModel.rotation.y = currentRot;
            currentModel.position.copy(currentPos);
            scene.add(currentModel);
            
            currentEmotion = emotion;
            
            // Restart animation
            if (newMixer && newModel.animations?.length > 0 && forceRestart) {
                newMixer.stopAllAction();
                newMixer.clipAction(newModel.animations[0]).reset().play();
            }
            
            updateEmotionUI(emotion);
            
            // Lighting effect for angry mode
            if (emotion === 'angry') {
                angryLight.intensity = 0.8;
                document.body.style.animation = 'shake 0.2s ease-in-out 0s 2';
                setTimeout(() => {
                    document.body.style.animation = '';
                }, 500);
            } else {
                angryLight.intensity = 0;
            }
            
            console.log(`🎭 Switched to ${emotionName} mode`);
        }
        
        function updateEmotionUI(emotion) {
            const badge = document.getElementById('emotionBadge');
            const animStatus = document.getElementById('animStatus');
            
            let text = '';
            let icon = '';
            let color = '';
            
            switch(emotion) {
                case 'idle':
                    text = 'SANTAI';
                    icon = '😊';
                    color = '#88ff88';
                    animStatus.innerHTML = '⚪ IDLE MODE (anime-idle.fbx)';
                    animStatus.style.color = '#88ff88';
                    animStatus.style.borderColor = '#88ff88';
                    break;
                case 'talking':
                    text = 'NGOBROL';
                    icon = '💬';
                    color = '#ffaa44';
                    animStatus.innerHTML = '🎤 TALKING MODE (talking.fbx)';
                    animStatus.style.color = '#ffaa44';
                    animStatus.style.borderColor = '#ffaa44';
                    break;
                case 'angry':
                    text = 'MARAH';
                    icon = '😠';
                    color = '#ff4444';
                    animStatus.innerHTML = '🔥 ANGRY MODE (angry.fbx)';
                    animStatus.style.color = '#ff4444';
                    animStatus.style.borderColor = '#ff4444';
                    break;
            }
            
            badge.innerHTML = `${icon} MODE: ${text}`;
            badge.style.borderColor = color;
            badge.style.color = color;
        }
        
        // Deteksi emosi dari teks
        function detectEmotionFromText(text) {
            const lowerText = text.toLowerCase();
            
            // Cek kata-kata marah
            for (let keyword of ANGRY_KEYWORDS) {
                if (lowerText.includes(keyword)) {
                    return 'angry';
                }
            }
            
            // Cek kata-kata kalem (bisa balikin ke normal)
            for (let keyword of CALM_KEYWORDS) {
                if (lowerText.includes(keyword)) {
                    return 'idle';
                }
            }
            
            return null;
        }
        
        // ============ SPEAKING TRIGGER ============
        function startSpeaking(emotion = 'talking') {
            if (isSpeaking) return;
            isSpeaking = true;
            switchToEmotion(emotion, true);
        }
        
        function stopSpeaking() {
            if (!isSpeaking) return;
            isSpeaking = false;
            
            // Kembali ke idle setelah selesai bicara
            if (switchTimeout) clearTimeout(switchTimeout);
            switchTimeout = setTimeout(() => {
                if (!isSpeaking && currentEmotion !== 'idle') {
                    switchToEmotion('idle', true);
                }
            }, 500);
        }
        
        // ============ ANIMATION LOOP ============
        let lastTime = 0;
        let animationId = null;
        
        function startAnimationLoop() {
            if (animationId) return;
            
            function animate() {
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;
                
                // Update animation mixers
                if (idleMixer) idleMixer.update(delta);
                if (talkMixer) talkMixer.update(delta);
                if (angryMixer) angryMixer.update(delta);
                
                controls.update();
                renderer.render(scene, camera);
                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        // ============ UI FUNCTIONS ============
        function updateStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerHTML = msg;
                statusDiv.style.color = isError ? '#ff0000' : '#ff6b6b';
            }
        }
        
        function addChatMessage(sender, message, isUser = false, emotion = null) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'chat-msg-user' : 'chat-msg-ai'}`;
            let name = isUser ? '👤 VIEWER' : '🎮 RAJA AI';
            
            // Tambah emoji berdasarkan emosi
            if (!isUser && emotion === 'angry') {
                name = '😠 RAJA AI (MARAH)';
            } else if (!isUser && emotion === 'talking') {
                name = '💬 RAJA AI';
            }
            
            msgDiv.innerHTML = `<span class="msg-name">${name}</span><div class="msg-text">${escapeHtml(message)}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            while (chatContainer.children.length > 60) chatContainer.removeChild(chatContainer.firstChild);
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Shake animation CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
        
        // ============ EVENT LISTENERS ============
        document.getElementById('forceAngryBtn')?.addEventListener('click', () => {
            if (!modelsLoaded) return;
            switchToEmotion('angry', true);
            addChatMessage('ai', 'WHAT?! Lu berani-beraninya bikin gue marah?! Awas aja lo! 😠', false, 'angry');
            setTimeout(() => {
                if (!isSpeaking) switchToEmotion('idle', true);
            }, 3000);
        });
        
        document.getElementById('forceIdleBtn')?.addEventListener('click', () => {
            if (!modelsLoaded) return;
            switchToEmotion('idle', true);
            addChatMessage('ai', 'Nah gitu dong, santai aja bro. 😊', false, 'idle');
        });
        
        document.getElementById('clearChatBtn').addEventListener('click', () => {
            document.getElementById('chatMessages').innerHTML = '';
            addChatMessage('ai', 'Yo! Chat dibersihin. Santai aja ya!', false);
        });
        
        let chatVisible = true;
        document.getElementById('toggleChatBtn').addEventListener('click', () => {
            const msgsDiv = document.getElementById('chatMessages');
            if (chatVisible) {
                msgsDiv.style.display = 'none';
                document.getElementById('toggleChatBtn').textContent = '+';
                chatVisible = false;
            } else {
                msgsDiv.style.display = 'flex';
                document.getElementById('toggleChatBtn').textContent = '−';
                chatVisible = true;
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ============ EXPOSE FUNCTIONS FOR VOICE SCRIPT ============
        window.triggerSpeakingWithEmotion = function(speaking, text = '', emotion = 'talking') {
            if (!modelsLoaded) return;
            
            const subtitleBox = document.getElementById('subtitleBox');
            const subtitleText = document.getElementById('subtitleText');
            
            if (speaking && text) {
                subtitleText.innerHTML = text;
                subtitleBox.style.display = 'flex';
                clearTimeout(window.subtitleTimeout);
                window.subtitleTimeout = setTimeout(() => {
                    if (!window.isSpeaking) subtitleBox.style.display = 'none';
                }, 4000);
                startSpeaking(emotion);
            } else if (!speaking) {
                setTimeout(() => { 
                    if (!window.isSpeaking) subtitleBox.style.display = 'none'; 
                }, 500);
                stopSpeaking();
            }
        };
        
        window.updateSubtitleAndChatWithEmotion = function(text, isAi = true, userMessage = '', emotion = 'talking') {
            if (isAi) {
                window.triggerSpeakingWithEmotion(true, text, emotion);
                addChatMessage('ai', text, false, emotion);
            } else if (userMessage) {
                // Deteksi emosi dari pesan user
                const detectedEmotion = detectEmotionFromText(userMessage);
                if (detectedEmotion === 'angry') {
                    // Kalau user marah, AI juga ikut marah
                    window.triggerSpeakingWithEmotion(true, userMessage, 'talking');
                    addChatMessage('user', userMessage, true);
                } else {
                    window.triggerSpeakingWithEmotion(true, userMessage, 'talking');
                    addChatMessage('user', userMessage, true);
                }
            }
        };
        
        // AUTO START
        console.log("🚀 Auto loading models with 3 emotions");
        loadModels();
    </script>

    <script>
        // Voice and AI functions with emotion detection
        let selectedVoice = localStorage.getItem('raja_voice') || 'Adam';
        let isListening = false;
        let isProcessing = false;
        let recognition = null;
        
        const VOICE_IDS = {
            Adam: 'pNInz6obpgDQGcFmaJgB',
            Antoni: 'ErXwobaYiN019PkySvjV',
            Bella: 'EXAVITQu4vr4xnSDxMaL',
            Dorothy: '3321Alera3fXjEWjjbAX'
        };
        const VOICE_NAMES = { Adam: 'Maulana', Antoni: 'Ulul', Bella: 'Inang', Dorothy: 'Siti' };
        
        // Keywords for anger detection
        const ANGRY_KEYWORDS = [
            'marah', 'geram', 'kesal', 'jengkel', 'sial', 'brengsek', 'bangsat',
            'tolol', 'bodoh', 'goblok', 'idiot', 'bego', 'dasar', 'kurang ajar',
            'ngentot', 'memek', 'kontol', 'anjing', 'setan', 'kampret',
            'fuck', 'shit', 'damn', 'hell', 'anger', 'mad', 'pissed'
        ];
        
        const SYSTEM_PROMPT_NORMAL = `Lo adalah karakter gaya GTA San Andreas. Lo cool, santai, kayak CJ. Gaya ngomong lo pake "Yo", "What's good", "Aight", "Nah mean". Lo friendly dan asyik diajak ngobrol. Respon singkat dan natural aja.`;
        
        const SYSTEM_PROMPT_ANGRY = `Lo adalah karakter GTA yang sedang MARAH BESAR! Lo kayak CJ kalo lagi emosi. Lo ngomong pake nada tinggi, kasar, banyak makian khas GTA kayak "What the hell", "Damn", "You stupid", "Fool", "Get outta here". Lo gak sabaran dan gampang triggered. TAPI jangan terlalu vulgar, tetap dalam batas wajar.`;
        
        const FUNCTION_URL = '/.netlify/functions/ai-chat';
        
        function detectEmotionFromText(text) {
            const lowerText = text.toLowerCase();
            for (let keyword of ANGRY_KEYWORDS) {
                if (lowerText.includes(keyword)) {
                    return 'angry';
                }
            }
            return 'normal';
        }
        
        function updateStatusUI(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerHTML = msg;
                statusDiv.style.color = isError ? '#ff0000' : '#ff6b6b';
            }
        }
        
        function setActiveVoice(voiceName) {
            selectedVoice = voiceName;
            localStorage.setItem('raja_voice', voiceName);
            ['Adam', 'Antoni', 'Bella', 'Dorothy'].forEach(v => {
                const btn = document.getElementById(`voice${v}`);
                if (btn) btn.classList.toggle('active', v === voiceName);
            });
            updateStatusUI(`✅ Suara ${VOICE_NAMES[voiceName]} aktif`);
        }
        
        document.getElementById('voiceAdam')?.addEventListener('click', () => setActiveVoice('Adam'));
        document.getElementById('voiceAntoni')?.addEventListener('click', () => setActiveVoice('Antoni'));
        document.getElementById('voiceBella')?.addEventListener('click', () => setActiveVoice('Bella'));
        document.getElementById('voiceDorothy')?.addEventListener('click', () => setActiveVoice('Dorothy'));
        setActiveVoice(selectedVoice);
        
        async function callGroqAPI(userMessage, emotion) {
            updateStatusUI('💭 Karakter mikir...');
            const systemPrompt = emotion === 'angry' ? SYSTEM_PROMPT_ANGRY : SYSTEM_PROMPT_NORMAL;
            
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'chat',
                    messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }]
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteArrays = [];
            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) byteNumbers[j] = slice.charCodeAt(j);
                byteArrays.push(new Uint8Array(byteNumbers));
            }
            return new Blob(byteArrays, { type: mimeType });
        }
        
        async function textToSpeechElevenLabs(text, emotion) {
            updateStatusUI(`🎙️ Karakter ${emotion === 'angry' ? 'marah' : 'ngomong'}...`);
            
            // Kirim ke fungsi update dengan emotion
            if (window.updateSubtitleAndChatWithEmotion) {
                window.updateSubtitleAndChatWithEmotion(text, true, '', emotion === 'angry' ? 'angry' : 'talking');
            }
            
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'tts', 
                    text: text, 
                    voiceId: VOICE_IDS[selectedVoice],
                    // Tambah parameter untuk kecepatan bicara pas marah
                    speed: emotion === 'angry' ? 1.2 : 1.0
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const audioBlob = base64ToBlob(data.audio, 'audio/mpeg');
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            return new Promise((resolve, reject) => {
                audio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    if (window.triggerSpeakingWithEmotion) {
                        window.triggerSpeakingWithEmotion(false, '', 'idle');
                    }
                    resolve();
                };
                audio.onerror = (e) => { URL.revokeObjectURL(audioUrl); reject(e); };
                audio.play().catch(reject);
            });
        }
        
        async function handleUserSpeech(text) {
            if (isProcessing) return;
            isProcessing = true;
            
            // Deteksi emosi dari pesan user
            const userEmotion = detectEmotionFromText(text);
            const responseEmotion = userEmotion === 'angry' ? 'angry' : 'normal';
            
            try {
                if (window.updateSubtitleAndChatWithEmotion) {
                    window.updateSubtitleAndChatWithEmotion('', false, text, userEmotion === 'angry' ? 'angry' : 'talking');
                }
                
                const aiResponse = await callGroqAPI(text, responseEmotion);
                await textToSpeechElevenLabs(aiResponse, responseEmotion);
                updateStatusUI('🎤 Klik mikrofon buat ngobrol lagi');
            } catch (error) {
                console.error(error);
                updateStatusUI(`❌ Error: ${error.message}`, true);
                if (window.updateSubtitleAndChatWithEmotion) {
                    window.updateSubtitleAndChatWithEmotion(`Error: ${error.message}`, true, '', 'idle');
                }
                if (window.triggerSpeakingWithEmotion) setTimeout(() => window.triggerSpeakingWithEmotion(false), 2000);
            } finally {
                isProcessing = false;
                const btn = document.getElementById('recordBtn');
                const recordText = document.getElementById('recordText');
                if (btn) btn.classList.remove('recording');
                if (recordText) recordText.textContent = 'MULAI BICARA';
            }
        }
        
        function startVoiceRecognition() {
            if (isProcessing) { updateStatusUI('⏳ Lagi ngomong, tunggu...', true); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { updateStatusUI('❌ Browser gak support voice', true); return; }
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('recordBtn');
                if (btn) btn.classList.add('recording');
                const recordText = document.getElementById('recordText');
                if (recordText) recordText.textContent = 'DENGERIN...';
                updateStatusUI('🎤 Silakan bicara...');
            };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                updateStatusUI(`📝 "${text}"`);
                stopVoiceRecognition();
                handleUserSpeech(text);
            };
            recognition.onerror = (event) => { if (event.error !== 'aborted') updateStatusUI(`❌ ${event.error}`, true); stopVoiceRecognition(); };
            recognition.onend = () => { if (isListening) stopVoiceRecognition(); };
            recognition.start();
        }
        
        function stopVoiceRecognition() {
            if (recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }
            isListening = false;
            const btn = document.getElementById('recordBtn');
            if (btn) btn.classList.remove('recording');
            const recordText = document.getElementById('recordText');
            if (recordText) recordText.textContent = 'MULAI BICARA';
        }
        
        function toggleRecording() {
            if (isProcessing) { updateStatusUI('⏳ Tunggu karakter selesai...', true); return; }
            if (isListening) stopVoiceRecognition();
            else startVoiceRecognition();
        }
        
        document.getElementById('recordBtn')?.addEventListener('click', toggleRecording);
        updateStatusUI('🎤 3 Mode: Santai (anime-idle) | Ngobrol (talking) | Marah (angry)');
    </script>
</body>
