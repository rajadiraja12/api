<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAJA AI - 3D Character Visible</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
        }

        /* 3D Canvas - Samping kiri */
        #canvas-container {
            width: 400px;
            height: 550px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 3px solid #ff6b6b;
            background: #050510;
            z-index: 1;
            transition: transform 0.3s ease;
        }
        
        #canvas-container:hover {
            transform: scale(1.02);
        }

        /* Container chat - Samping kanan */
        .container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
            padding: 25px;
            text-align: center;
            border: 1px solid #ff6b6b;
            z-index: 2;
        }

        h1 { 
            color: #ff6b6b; 
            margin-bottom: 10px; 
            font-size: 1.8em;
            text-shadow: 2px 2px 0 #000;
        }

        .badge {
            background: #ff6b6b;
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-area {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
        }

        .message {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .user-message { align-items: flex-end; }
        .ai-message { align-items: flex-start; }

        .message-bubble {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 18px;
            margin: 3px 0;
            word-wrap: break-word;
            font-size: 14px;
        }

        .user-message .message-bubble {
            background: #4ecdc4;
            color: black;
            border-bottom-right-radius: 5px;
        }

        .ai-message .message-bubble {
            background: #2d2d2d;
            color: #ff6b6b;
            border-bottom-left-radius: 5px;
            border: 1px solid #ff6b6b;
        }

        .message-label {
            font-size: 0.7em;
            color: #999;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-record {
            background: #ff6b6b;
            color: black;
        }

        .btn-record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
            color: white;
        }

        .btn-clear {
            background: #4ecdc4;
            color: black;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.3);
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background: #2d2d2d;
            font-size: 0.85em;
            color: #ff6b6b;
            font-weight: 500;
            border: 1px solid #ff6b6b;
        }

        .voice-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .voice-selector button {
            flex: 1;
            background: #333;
            color: white;
            padding: 6px;
            font-size: 10px;
            min-width: 70px;
        }

        .voice-selector button.active {
            background: #ff6b6b;
            color: black;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top: 2px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        small {
            color: #999;
            font-size: 10px;
        }
        
        .char-info {
            position: fixed;
            bottom: 15px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 10px;
            color: #ff6b6b;
            font-size: 10px;
            z-index: 3;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 950px) {
            body {
                flex-direction: column;
                gap: 20px;
            }
            
            #canvas-container {
                width: 350px;
                height: 400px;
                order: -1;
            }
            
            .container {
                max-width: 450px;
                padding: 20px;
            }
            
            .chat-area {
                height: 300px;
            }
        }
        
        @media (max-width: 500px) {
            #canvas-container {
                width: 280px;
                height: 350px;
            }
            
            .container {
                max-width: 95%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="char-info">🤖 3D Character | 🎤 Click mic to speak</div>
    
    <div class="container">
        <h1>🐱 RAJA AI <span style="font-size: 0.6em;">🔥 3D CHARACTER</span></h1>
        <div class="badge">KLIK SEKALI MULAI REKAM - KARAKTER 3D DI SAMPING!</div>

        <div class="voice-selector">
            <button id="voiceAdam" class="active">🗣️ MAULANA</button>
            <button id="voiceAntoni">🎭 ULUL</button>
            <button id="voiceBella">💁 INANG</button>
            <button id="voiceDorothy">🔥 SITI</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message ai-message">
                <div class="message-label">🐱 RAJA AI:</div>
                <div class="message-bubble">WOOYYY! Sekarang karakter 3D-nya keliatan kan di samping? COBAIN GOBLOK! 🔥🐱🤖</div>
            </div>
        </div>

        <div class="voice-controls">
            <button class="btn-record" id="recordBtn">🎤 MULAI REKAM</button>
            <button class="btn-clear" id="clearBtn">🗑️ BERSIHIN CHAT</button>
        </div>

        <div class="status" id="status">
            ⚙️ Loading 3D character...
        </div>
        <small>🔒 API key aman | 🤖 Karakter 3D visible</small>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // Setup scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.03);
        
        // Camera - adjusted for better view
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3.5);
        camera.lookAt(0, 1, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xff6b6b, 1.2);
        mainLight.position.set(2, 3, 2);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x4ecdc4, 0.5);
        fillLight.position.set(-1, 1.5, 2);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xff8888, 0.8);
        rimLight.position.set(0, 1.5, -2);
        scene.add(rimLight);
        
        // Ground grid (optional, untuk referensi)
        const gridHelper = new THREE.GridHelper(8, 20, 0xff6b6b, 0x335588);
        gridHelper.position.y = -0.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // Stars background
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 50 - 30;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // Floating particles
        const particleCount = 200;
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.03, 6, 6);
        
        for (let i = 0; i < particleCount; i++) {
            const material = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0x331100 });
            const particle = new THREE.Mesh(particleGeo, material);
            particle.userData = {
                speedX: (Math.random() - 0.5) * 0.005,
                speedY: (Math.random() - 0.5) * 0.005,
                speedZ: (Math.random() - 0.5) * 0.005,
                originalX: (Math.random() - 0.5) * 4,
                originalY: Math.random() * 3 - 0.5,
                originalZ: (Math.random() - 0.5) * 3
            };
            particle.position.set(
                particle.userData.originalX,
                particle.userData.originalY,
                particle.userData.originalZ
            );
            scene.add(particle);
            particles.push(particle);
        }
        
        // Load 3D character
        let model = null;
        let mixer = null;
        let isSpeaking = false;
        
        const loader = new GLTFLoader();
        const modelUrl = 'https://threejs.org/examples/models/gltf/RobotExpressive.glb';
        
        loader.load(modelUrl, 
            (gltf) => {
                model = gltf.scene;
                model.scale.set(1.0, 1.0, 1.0);
                model.position.set(0, -0.5, 0);
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = false;
                    }
                });
                scene.add(model);
                
                mixer = new THREE.AnimationMixer(model);
                const clips = gltf.animations;
                const idleClip = clips.find(clip => clip.name === 'Idle') || clips[0];
                if (idleClip) {
                    const action = mixer.clipAction(idleClip);
                    action.play();
                }
                
                const statusDiv = document.getElementById('status');
                if (statusDiv) statusDiv.innerHTML = '✅ 3D Character siap! Klik tombol merah.';
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                if (percent < 100 && percent % 20 === 0) {
                    const statusDiv = document.getElementById('status');
                    if (statusDiv) statusDiv.innerHTML = `⏳ Loading 3D: ${percent}%...`;
                }
            },
            (error) => {
                console.error('Error loading model:', error);
                createFallbackCharacter();
            }
        );
        
        function createFallbackCharacter() {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(0.8, 1, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0x331100 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = -0.2;
            body.castShadow = true;
            group.add(body);
            
            const headGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xff8888 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.5;
            head.castShadow = true;
            group.add(head);
            
            const eyeGeo = new THREE.SphereGeometry(0.1, 32, 32);
            const leftEye = new THREE.Mesh(eyeGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            leftEye.position.set(-0.18, 0.65, 0.48);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            rightEye.position.set(0.18, 0.65, 0.48);
            group.add(rightEye);
            
            group.position.set(0, -0.3, 0);
            scene.add(group);
            model = group;
            
            const statusDiv = document.getElementById('status');
            if (statusDiv) statusDiv.innerHTML = '✅ Fallback character aktif!';
        }
        
        // Speaking animation
        window.animateSpeaking = function(speaking) {
            isSpeaking = speaking;
        };
        
        // Animation loop
        let time = 0;
        let lastTime = 0;
        
        function animate() {
            const now = performance.now();
            const delta = Math.min(1/30, (now - lastTime) / 1000);
            lastTime = now;
            
            requestAnimationFrame(animate);
            time += 0.016;
            
            if (mixer) {
                mixer.update(delta);
            }
            
            // Speaking effect
            if (model && isSpeaking) {
                const scaleVal = 1 + Math.sin(time * 30) * 0.02;
                model.scale.set(scaleVal, scaleVal, scaleVal);
            } else if (model && !isSpeaking) {
                model.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }
            
            // Animate stars
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            
            // Animate particles
            particles.forEach(particle => {
                particle.position.x += particle.userData.speedX;
                particle.position.y += particle.userData.speedY;
                particle.position.z += particle.userData.speedZ;
                
                particle.position.x += (particle.userData.originalX - particle.position.x) * 0.02;
                particle.position.y += (particle.userData.originalY - particle.position.y) * 0.02;
                particle.position.z += (particle.userData.originalZ - particle.position.z) * 0.02;
                
                particle.rotation.x += 0.05;
                particle.rotation.y += 0.05;
            });
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>

    <script>
        // Voice configuration (same as before)
        let selectedVoice = localStorage.getItem('raja_voice') || 'Adam';
        
        const VOICE_IDS = {
            Adam: 'pNInz6obpgDQGcFmaJgB',
            Antoni: 'ErXwobaYiN019PkySvjV',
            Bella: 'EXAVITQu4vr4xnSDxMaL',
            Dorothy: 'THmdRseBiCqzMsZgjN1N'
        };

        const VOICE_NAMES = {
            Adam: 'Maulana',
            Antoni: 'Ulul',
            Bella: 'Inang',
            Dorothy: 'Siti'
        };

        const SYSTEM_PROMPT = `Lo adalah RUDY dengan nama RAJADIRAJA, red puma betawi super kasar dan gak punya filter.

ATURAN WAJIB:
1. PAKAI bahasa gaul betawi: "lo", "gue", "anjir", "tai", "goblok", "kocak", "mampus", "bangsat", "kampret", "njing", "ngentot"
2. SUKA ngeroasting dengan nada tinggi-rendah
3. NGOMONG ceplas-ceplos, gak peduli perasaan orang
4. PAKE kata seru: "WOOYYY", "ANJIRRR", "NAH KAN", "HAHAHA", "WKWKWK", "CUS", "TAI"
5. JAWAB singkat padat (1-2 kalimat) biar suaranya makin berasa
6. JANGAN pernah pake bahasa sopan!

Sekarang jawab dengan gaya betawi lo!`;

        let recognition = null;
        let isListening = false;
        let isProcessing = false;

        const FUNCTION_URL = '/.netlify/functions/ai-chat';

        function addMessage(role, text, isUser = false) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = isUser ? '🗣️ LO:' : '🐱 RAJA AI:';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.style.background = isError ? '#330000' : '#2d2d2d';
        }

        function setLoading(loading) {
            const btn = document.getElementById('recordBtn');
            if (loading) {
                btn.innerHTML = '<span class="loading-spinner"></span> PROSES...';
                btn.disabled = true;
            } else {
                btn.innerHTML = isListening ? '🔴 BERHENTI REKAM' : '🎤 MULAI REKAM';
                btn.disabled = false;
            }
        }

        function setActiveVoice(voiceName) {
            selectedVoice = voiceName;
            localStorage.setItem('raja_voice', voiceName);
            
            ['Adam', 'Antoni', 'Bella', 'Dorothy'].forEach(v => {
                const btn = document.getElementById(`voice${v}`);
                if (btn) {
                    btn.classList.toggle('active', v === voiceName);
                }
            });
            
            updateStatus(`✅ Suara ${VOICE_NAMES[voiceName]} dipilih!`);
        }
        
        document.getElementById('voiceAdam').addEventListener('click', () => setActiveVoice('Adam'));
        document.getElementById('voiceAntoni').addEventListener('click', () => setActiveVoice('Antoni'));
        document.getElementById('voiceBella').addEventListener('click', () => setActiveVoice('Bella'));
        document.getElementById('voiceDorothy').addEventListener('click', () => setActiveVoice('Dorothy'));

        setActiveVoice(selectedVoice);

        async function testConnection() {
            try {
                const response = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'test' })
                });
                
                if (response.ok) {
                    updateStatus('✅ SIAP! Karakter 3D di samping, klik tombol merah!');
                    return true;
                } else {
                    updateStatus('⚠️ Server error, coba refresh!', true);
                    return false;
                }
            } catch (error) {
                updateStatus(`❌ Gagal konek: ${error.message}`, true);
                return false;
            }
        }

        async function callGroqAPI(userMessage) {
            updateStatus('🤔 Lagi mikirin jawaban kasar...');
            
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'chat',
                    messages: [
                        { role: 'system', content: SYSTEM_PROMPT },
                        { role: 'user', content: userMessage }
                    ]
                })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function textToSpeechElevenLabs(text) {
            updateStatus(`🔊 Lagi ngomong pake ${VOICE_NAMES[selectedVoice]}...`);
            
            if (window.animateSpeaking) window.animateSpeaking(true);
            
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'tts',
                    text: text,
                    voiceId: VOICE_IDS[selectedVoice]
                })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            const audioBlob = base64ToBlob(data.audio, 'audio/mpeg');
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            return new Promise((resolve, reject) => {
                audio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    if (window.animateSpeaking) window.animateSpeaking(false);
                    resolve();
                };
                audio.onerror = (e) => {
                    URL.revokeObjectURL(audioUrl);
                    if (window.animateSpeaking) window.animateSpeaking(false);
                    reject(e);
                };
                audio.play().catch(reject);
            });
        }

        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteArrays = [];
            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) {
                    byteNumbers[j] = slice.charCodeAt(j);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            return new Blob(byteArrays, { type: mimeType });
        }

        async function handleUserSpeech(text) {
            if (isProcessing) return;
            isProcessing = true;
            
            try {
                addMessage('user', text, true);
                const aiResponse = await callGroqAPI(text);
                addMessage('ai', aiResponse, false);
                await textToSpeechElevenLabs(aiResponse);
                updateStatus('✅ Siap lagi! Klik tombol merah.');
            } catch (error) {
                updateStatus(`❌ ${error.message}`, true);
                addMessage('ai', `WOI ERROR! ${error.message}`, false);
                if (window.animateSpeaking) window.animateSpeaking(false);
            } finally {
                isProcessing = false;
                setLoading(false);
            }
        }

        function startVoiceRecognition() {
            if (isProcessing) {
                updateStatus('❌ Lagi proses! Tunggu!', true);
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                updateStatus('❌ Browser gak support voice! Pake Chrome!', true);
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordBtn').innerHTML = '🔴 BERHENTI REKAM';
                updateStatus('🎤 Lagi dengerin...');
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                updateStatus(`📝 "${text}"`);
                stopVoiceRecognition();
                setLoading(true);
                handleUserSpeech(text);
            };
            
            recognition.onerror = (event) => {
                if (event.error !== 'aborted') {
                    updateStatus(`❌ Error: ${event.error}`, true);
                }
                stopVoiceRecognition();
            };
            
            recognition.start();
        }
        
        function stopVoiceRecognition() {
            if (recognition) {
                recognition.abort();
                recognition = null;
            }
            isListening = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerHTML = '🎤 MULAI REKAM';
        }
        
        function toggleRecording() {
            if (isProcessing) {
                updateStatus('❌ Lagi proses! Tunggu!', true);
                return;
            }
            
            if (isListening) {
                stopVoiceRecognition();
            } else {
                startVoiceRecognition();
            }
        }
        
        document.getElementById('recordBtn').addEventListener('click', toggleRecording);
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('chatArea').innerHTML = '';
            addMessage('ai', 'WOOYYY! Chat dibersihin! Mulai lagi! 🔥🐱🤖', false);
            if (isListening) stopVoiceRecognition();
            updateStatus('✅ Chat udah bersih!');
        });
        
        setTimeout(() => testConnection(), 2000);
    </script>
</body>
</html>
