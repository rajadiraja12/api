<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAJA AI - VTuber Professional Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .chat-history {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #ff6b6b;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 16px;
            background: rgba(255,107,107,0.2);
            border-bottom: 1px solid #ff6b6b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
        }

        .toggle-chat, .clear-chat {
            background: rgba(255,107,107,0.2);
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 340px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b6b; border-radius: 10px; }

        .chat-message {
            animation: fadeInMsg 0.3s ease;
            font-size: 12px;
        }

        .chat-msg-user { text-align: right; }
        .chat-msg-ai { text-align: left; }

        .msg-name {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
            display: block;
        }

        .chat-msg-user .msg-name { color: #ffd966; }
        .chat-msg-ai .msg-name { color: #ff6b6b; }

        .msg-text {
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 6px 12px;
            border-radius: 18px;
            max-width: 90%;
            word-wrap: break-word;
            color: #f0f0f0;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .subtitle-area {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 700px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
        }

        .subtitle-box {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 24px;
            border: 2px solid #ff6b6b;
        }

        .subtitle-text {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }

        .ui-overlay {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 22px;
            border-radius: 60px;
            border: 1px solid #ff6b6b;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ff6b6b;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: black;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,107,107,0.5);
        }

        .btn-record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
            color: white;
        }

        .voice-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .voice-selector button {
            background: #333;
            color: white;
            padding: 8px 14px;
            font-size: 12px;
        }

        .voice-selector button.active {
            background: #ff6b6b;
            color: black;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background: #cc0000; }
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            color: #ff6b6b;
            font-size: 12px;
            z-index: 10;
            border: 1px solid #ff6b6b;
            font-family: monospace;
            max-width: 300px;
        }

        .character-name {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 1px solid #ff6b6b;
        }

        .model-url-input {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 20px;
            z-index: 10;
            border: 1px solid #ff6b6b;
            pointer-events: auto;
            width: 300px;
        }

        .model-url-input label {
            color: #ff6b6b;
            font-size: 11px;
            display: block;
            margin-bottom: 6px;
        }

        .model-url-input input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 11px;
        }

        .model-url-input input:focus {
            outline: none;
            border: 1px solid #ff6b6b;
        }

        .model-url-input button {
            margin-top: 8px;
            padding: 6px 12px;
            font-size: 11px;
            background: #ff6b6b;
            width: 100%;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .chat-history { width: 270px; }
            .model-url-input { width: 250px; top: 70px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="chat-history">
        <div class="chat-header">
            <h3>💬 LIVE CHAT</h3>
            <div style="display: flex; gap: 8px;">
                <button class="clear-chat" id="clearChatBtn">✖ Clear</button>
                <button class="toggle-chat" id="toggleChatBtn">−</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message chat-msg-ai">
                <span class="msg-name">🎙️ RAJA AI</span>
                <div class="msg-text">Selamat datang di livestream! Upload GLB atau masukin URL untuk mulai.</div>
            </div>
        </div>
    </div>
    
    <div class="model-url-input">
        <label>📁 Pilih file GLB atau masukin URL:</label>
        <input type="file" id="glbFileInput" accept=".glb,.gltf">
        <input type="text" id="modelUrlInput" placeholder="Atau URL: https://.../model.glb" style="margin-top: 8px;">
        <button id="loadModelBtn">🔄 Load Model</button>
    </div>
    
    <div class="subtitle-area">
        <div class="subtitle-box" id="subtitleBox" style="display: none;">
            <div class="subtitle-text" id="subtitleText">...</div>
        </div>
    </div>
    
    <div class="ui-overlay">
        <div class="controls">
            <button class="btn-record" id="recordBtn">
                🎤 <span id="recordText">MULAI BICARA</span>
            </button>
            <div class="voice-selector">
                <button id="voiceAdam" class="active">🗣️ MAULANA</button>
                <button id="voiceAntoni">🎭 ULUL</button>
                <button id="voiceBella">💁 INANG</button>
                <button id="voiceDorothy">🔥 SITI</button>
            </div>
        </div>
    </div>
    
    <div class="character-name">🎙️ RAJA AI · LIVE STREAMER</div>
    <div class="status-indicator" id="status">📁 Pilih file GLB untuk mulai</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.3, 3.8);
        camera.lookAt(0, 1.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.zoomSpeed = 1;
        controls.target.set(0, 1.2, 0);
        
        // Lighting - Professional studio lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        // Key light (main)
        const keyLight = new THREE.DirectionalLight(0xffccaa, 1.2);
        keyLight.position.set(1.5, 2.5, 2);
        keyLight.castShadow = true;
        scene.add(keyLight);
        
        // Fill light
        const fillLight = new THREE.PointLight(0x88aaff, 0.4);
        fillLight.position.set(1, 1.2, 1.5);
        scene.add(fillLight);
        
        // Rim light (backlight)
        const rimLight = new THREE.PointLight(0xffaa88, 0.5);
        rimLight.position.set(0, 1.5, -2);
        scene.add(rimLight);
        
        // Soft fill from below
        const bottomFill = new THREE.PointLight(0xccaa88, 0.3);
        bottomFill.position.set(0, -0.5, 0);
        scene.add(bottomFill);
        
        // Simple ground shadow receiver
        const gridHelper = new THREE.GridHelper(8, 20, 0xffaa88, 0x443366);
        gridHelper.position.y = -0.9;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        // Particles - subtle sparkles (like studio atmosphere)
        const particles = [];
        for (let i = 0; i < 150; i++) {
            const material = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 });
            const particleGeo = new THREE.SphereGeometry(0.01, 6, 6);
            const particle = new THREE.Mesh(particleGeo, material);
            particle.userData = {
                speedY: 0.001 + Math.random() * 0.002,
                originalX: (Math.random() - 0.5) * 6,
                originalY: Math.random() * 2 - 0.5,
                originalZ: (Math.random() - 0.5) * 5
            };
            particle.position.set(particle.userData.originalX, particle.userData.originalY, particle.userData.originalZ);
            scene.add(particle);
            particles.push(particle);
        }
        
        // GLB Model variables
        let currentModel = null;
        let mixer = null;
        let isSpeaking = false;
        let speakIntensity = 0;
        let gestureTime = 0;
        
        // Store original transforms
        let originalPos = new THREE.Vector3();
        let originalRot = new THREE.Euler();
        let originalScale = new THREE.Vector3(1, 1, 1);
        
        function updateStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = msg;
            statusDiv.style.color = isError ? '#ff0000' : '#ff6b6b';
            console.log(msg);
        }
        
        // ============ PROFESSIONAL VTUBER/REPORTER GESTURES ============
        // No bouncing, no random waving, just natural presenter movements
        function applyProfessionalGestures(deltaTime) {
            if (!currentModel) return;
            
            gestureTime += deltaTime;
            
            const isAnimating = isSpeaking;
            
            if (isAnimating) {
                // Smooth intensity ramping
                speakIntensity = Math.min(speakIntensity + deltaTime * 4, 1);
                
                // ===== BODY MOVEMENT =====
                // Slight forward lean (like reporter explaining something)
                currentModel.rotation.x = originalRot.x - 0.03 * speakIntensity;
                
                // Very subtle body rotation (like presenter turning slightly to audience)
                currentModel.rotation.y = originalRot.y + Math.sin(gestureTime * 0.8) * 0.01 * speakIntensity;
                
                // No side-to-side sway, no bounce
                currentModel.rotation.z = originalRot.z;
                
                // ===== HEAD MOVEMENT (like nodding while explaining) =====
                currentModel.traverse((node) => {
                    const name = node.name.toLowerCase();
                    
                    if (name.includes('head') || name.includes('neck')) {
                        // Natural head nod like a presenter
                        node.rotation.x = (node.userData?.originalX || 0) + Math.sin(gestureTime * 2.5) * 0.03 * speakIntensity;
                        node.rotation.y = (node.userData?.originalY || 0) + Math.sin(gestureTime * 1.5) * 0.04 * speakIntensity;
                        node.rotation.z = (node.userData?.originalZ || 0) + Math.sin(gestureTime * 2) * 0.01 * speakIntensity;
                    }
                    
                    // ===== RIGHT ARM (main gesture - like explaining points) =====
                    if ((name.includes('right') || name.includes('r_')) && (name.includes('arm') || name.includes('hand'))) {
                        const gesture = Math.sin(gestureTime * 3);
                        // Open hand gesture like making a point
                        node.rotation.z = (node.userData?.originalZ || 0) - 0.25 * speakIntensity + gesture * 0.12 * speakIntensity;
                        node.rotation.x = (node.userData?.originalX || 0) + 0.08 * speakIntensity;
                    }
                    
                    // ===== LEFT ARM (supporting gesture, minimal) =====
                    if ((name.includes('left') || name.includes('l_')) && (name.includes('arm') || name.includes('hand'))) {
                        const gesture = Math.sin(gestureTime * 3 + 1);
                        // Left hand only follows slightly, not dominant
                        node.rotation.z = (node.userData?.originalZ || 0) + gesture * 0.05 * speakIntensity;
                        node.rotation.x = (node.userData?.originalX || 0) + 0.03 * speakIntensity;
                    }
                });
                
            } else {
                // IDLE MODE - Professional, calm stance
                speakIntensity = Math.max(speakIntensity - deltaTime * 5, 0);
                
                // ===== IDLE BREATHING (subtle, like real person standing) =====
                const breath = Math.sin(gestureTime * 1.8) * 0.003;
                currentModel.position.y = originalPos.y + breath;
                
                // Return to upright posture
                currentModel.rotation.x += (originalRot.x - currentModel.rotation.x) * 0.1;
                currentModel.rotation.y += (originalRot.y - currentModel.rotation.y) * 0.05;
                currentModel.rotation.z += (originalRot.z - currentModel.rotation.z) * 0.1;
                
                // ===== IDLE HEAD MOVEMENT (occasional small nod, like listening) =====
                currentModel.traverse((node) => {
                    const name = node.name.toLowerCase();
                    
                    if (name.includes('head') || name.includes('neck')) {
                        // Very subtle idle movement - like a person standing naturally
                        const idleNod = Math.sin(gestureTime * 0.7) * 0.01;
                        node.rotation.x = (node.userData?.originalX || 0) + idleNod;
                        node.rotation.y = (node.userData?.originalY || 0) + Math.sin(gestureTime * 0.4) * 0.008;
                        node.rotation.z = (node.userData?.originalZ || 0);
                    }
                    
                    // Return arms to relaxed position
                    if ((name.includes('arm') || name.includes('hand'))) {
                        if (node.userData?.originalZ !== undefined) {
                            node.rotation.z += (node.userData.originalZ - node.rotation.z) * 0.08;
                        }
                        if (node.userData?.originalX !== undefined) {
                            node.rotation.x += (node.userData.originalX - node.rotation.x) * 0.08;
                        }
                    }
                });
            }
        }
        
        // Store original bone rotations
        function storeOriginalTransforms(model) {
            originalPos.copy(model.position);
            originalRot.copy(model.rotation);
            originalScale.copy(model.scale);
            
            model.traverse((node) => {
                if (node.isBone || node.isMesh) {
                    node.userData.originalX = node.rotation.x;
                    node.userData.originalY = node.rotation.y;
                    node.userData.originalZ = node.rotation.z;
                }
            });
            console.log("✅ Original transforms stored");
        }
        
        // Load GLB from File
        function loadModelFromFile(file) {
            if (!file) return;
            
            updateStatus("🔄 Loading: " + file.name + " (" + (file.size/1024/1024).toFixed(2) + " MB)");
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                const loader = new GLTFLoader();
                
                if (currentModel) {
                    scene.remove(currentModel);
                    if (mixer) mixer.stopAllAction();
                    currentModel = null;
                }
                
                loader.parse(arrayBuffer, '', (gltf) => {
                    currentModel = gltf.scene;
                    
                    // Auto-scale to fit camera view
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    const targetHeight = 1.6;
                    const scale = targetHeight / size.y;
                    currentModel.scale.set(scale, scale, scale);
                    
                    // Position at ground level
                    const minY = box.min.y * scale;
                    currentModel.position.y = -minY;
                    currentModel.position.x = -center.x * scale;
                    currentModel.position.z = -center.z * scale;
                    
                    // Enable shadows
                    currentModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    scene.add(currentModel);
                    
                    // Play default animation if exists
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        const action = mixer.clipAction(gltf.animations[0]);
                        action.play();
                    }
                    
                    storeOriginalTransforms(currentModel);
                    controls.target.set(0, 1.2, 0);
                    controls.update();
                    
                    updateStatus("✅ Model loaded! VTuber mode aktif - gerakan profesional seperti presenter!");
                    
                }, (error) => {
                    console.error("Parse error:", error);
                    updateStatus("❌ Gagal load GLB: " + error.message, true);
                });
            };
            reader.onerror = () => {
                updateStatus("❌ Gagal baca file!", true);
            };
            reader.readAsArrayBuffer(file);
        }
        
        // Load GLB from URL
        function loadModelFromUrl(url) {
            updateStatus("🔄 Loading dari URL...");
            const loader = new GLTFLoader();
            
            if (currentModel) {
                scene.remove(currentModel);
                if (mixer) mixer.stopAllAction();
                currentModel = null;
            }
            
            loader.load(url, (gltf) => {
                currentModel = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const targetHeight = 1.6;
                const scale = targetHeight / size.y;
                currentModel.scale.set(scale, scale, scale);
                
                const minY = box.min.y * scale;
                currentModel.position.y = -minY;
                currentModel.position.x = -center.x * scale;
                currentModel.position.z = -center.z * scale;
                
                currentModel.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                
                scene.add(currentModel);
                
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(currentModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
                
                storeOriginalTransforms(currentModel);
                controls.target.set(0, 1.2, 0);
                controls.update();
                
                updateStatus("✅ Model loaded! VTuber professional mode aktif!");
                
            }, (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                updateStatus(`📥 Loading: ${percent}%`);
            }, (error) => {
                console.error("Load error:", error);
                updateStatus("❌ Gagal load: " + error.message, true);
            });
        }
        
        // Event listeners
        document.getElementById('loadModelBtn').addEventListener('click', () => {
            const fileInput = document.getElementById('glbFileInput');
            const urlInput = document.getElementById('modelUrlInput');
            
            if (fileInput.files && fileInput.files.length > 0) {
                loadModelFromFile(fileInput.files[0]);
            } else if (urlInput.value.trim()) {
                loadModelFromUrl(urlInput.value.trim());
            } else {
                updateStatus("❌ Pilih file GLB atau masukin URL!", true);
            }
        });
        
        // Animation loop
        let lastTime = 0;
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            requestAnimationFrame(animate);
            
            if (mixer) mixer.update(delta);
            applyProfessionalGestures(delta);
            
            // Subtle particle animation
            particles.forEach(p => {
                p.position.y += p.userData.speedY;
                if (p.position.y > 1.5) p.position.y = -0.5;
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ============ CHAT & SPEECH FUNCTIONS ============
        window.triggerSpeaking = function(speaking, text = '', isUser = false) {
            isSpeaking = speaking;
            const subtitleBox = document.getElementById('subtitleBox');
            const subtitleText = document.getElementById('subtitleText');
            
            if (speaking && text) {
                subtitleText.innerHTML = text;
                subtitleBox.style.display = 'flex';
                clearTimeout(window.subtitleTimeout);
                window.subtitleTimeout = setTimeout(() => {
                    if (!isSpeaking) subtitleBox.style.display = 'none';
                }, 4000);
            } else if (!speaking) {
                setTimeout(() => { if (!isSpeaking) subtitleBox.style.display = 'none'; }, 500);
            }
        };
        
        function addChatMessage(sender, message, isUser = false) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${isUser ? 'chat-msg-user' : 'chat-msg-ai'}`;
            const name = isUser ? '👤 VIEWER' : '🎙️ RAJA AI';
            msgDiv.innerHTML = `<span class="msg-name">${name}</span><div class="msg-text">${escapeHtml(message)}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            while (chatContainer.children.length > 60) chatContainer.removeChild(chatContainer.firstChild);
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('clearChatBtn').addEventListener('click', () => {
            document.getElementById('chatMessages').innerHTML = '';
            addChatMessage('ai', 'Live stream berlanjut! Ayo ngobrol!', false);
        });
        
        let chatVisible = true;
        document.getElementById('toggleChatBtn').addEventListener('click', () => {
            const msgsDiv = document.getElementById('chatMessages');
            if (chatVisible) {
                msgsDiv.style.display = 'none';
                document.getElementById('toggleChatBtn').textContent = '+';
                chatVisible = false;
            } else {
                msgsDiv.style.display = 'flex';
                document.getElementById('toggleChatBtn').textContent = '−';
                chatVisible = true;
            }
        });
        
        window.updateSubtitleAndChat = function(text, isAi = true, userMessage = '') {
            if (isAi) {
                window.triggerSpeaking(true, text, false);
                addChatMessage('ai', text, false);
            } else if (userMessage) {
                window.triggerSpeaking(true, userMessage, true);
                addChatMessage('user', userMessage, true);
            }
        };
        
        updateStatus("📁 Upload file GLB untuk mulai livestream!");
    </script>

    <script>
        // Voice and AI functions
        let selectedVoice = localStorage.getItem('raja_voice') || 'Adam';
        let isListening = false;
        let isProcessing = false;
        let recognition = null;
        
        const VOICE_IDS = {
            Adam: 'pNInz6obpgDQGcFmaJgB',
            Antoni: 'ErXwobaYiN019PkySvjV',
            Bella: 'EXAVITQu4vr4xnSDxMaL',
            Dorothy: 'THmdRseBiCqzMsZgjN1N'
        };
        const VOICE_NAMES = { Adam: 'Maulana', Antoni: 'Ulul', Bella: 'Inang', Dorothy: 'Siti' };
        
        const SYSTEM_PROMPT = `Lo adalah host livestream profesional bernama RAJA AI. Gaya bicara lo seperti presenter TV atau VTuber chatting stream. Lo ramah, profesional, dan engaging. PAKAI bahasa Indonesia yang baik tapi santai. KALO ada yang nanya, jawab dengan antusias seperti host wawancara. JANGAN kasar, JANGAN pake kata-kata kotor. Lo adalah streamer yang asyik ditonton.`;
        
        const FUNCTION_URL = '/.netlify/functions/ai-chat';
        
        function updateStatusUI(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerHTML = msg;
                statusDiv.style.color = isError ? '#ff0000' : '#ff6b6b';
            }
        }
        
        function setActiveVoice(voiceName) {
            selectedVoice = voiceName;
            localStorage.setItem('raja_voice', voiceName);
            ['Adam', 'Antoni', 'Bella', 'Dorothy'].forEach(v => {
                const btn = document.getElementById(`voice${v}`);
                if (btn) btn.classList.toggle('active', v === voiceName);
            });
            updateStatusUI(`✅ Suara ${VOICE_NAMES[voiceName]} aktif`);
        }
        
        document.getElementById('voiceAdam')?.addEventListener('click', () => setActiveVoice('Adam'));
        document.getElementById('voiceAntoni')?.addEventListener('click', () => setActiveVoice('Antoni'));
        document.getElementById('voiceBella')?.addEventListener('click', () => setActiveVoice('Bella'));
        document.getElementById('voiceDorothy')?.addEventListener('click', () => setActiveVoice('Dorothy'));
        setActiveVoice(selectedVoice);
        
        async function callGroqAPI(userMessage) {
            updateStatusUI('💭 Host sedang mikir...');
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'chat',
                    messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: userMessage }]
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteArrays = [];
            for (let i = 0; i < byteCharacters.length; i += 512) {
                const slice = byteCharacters.slice(i, i + 512);
                const byteNumbers = new Array(slice.length);
                for (let j = 0; j < slice.length; j++) byteNumbers[j] = slice.charCodeAt(j);
                byteArrays.push(new Uint8Array(byteNumbers));
            }
            return new Blob(byteArrays, { type: mimeType });
        }
        
        async function textToSpeechElevenLabs(text) {
            updateStatusUI(`🎙️ Host sedang bicara...`);
            if (window.updateSubtitleAndChat) window.updateSubtitleAndChat(text, true, '');
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'tts', text: text, voiceId: VOICE_IDS[selectedVoice] })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const audioBlob = base64ToBlob(data.audio, 'audio/mpeg');
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            return new Promise((resolve, reject) => {
                audio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    if (window.triggerSpeaking) window.triggerSpeaking(false, '');
                    resolve();
                };
                audio.onerror = (e) => { URL.revokeObjectURL(audioUrl); reject(e); };
                audio.play().catch(reject);
            });
        }
        
        async function handleUserSpeech(text) {
            if (isProcessing) return;
            isProcessing = true;
            try {
                if (window.updateSubtitleAndChat) window.updateSubtitleAndChat('', false, text);
                const aiResponse = await callGroqAPI(text);
                await textToSpeechElevenLabs(aiResponse);
                updateStatusUI('🎤 Klik tombol mikrofon untuk bicara lagi');
            } catch (error) {
                console.error(error);
                updateStatusUI(`❌ Error: ${error.message}`, true);
                if (window.updateSubtitleAndChat) window.updateSubtitleAndChat(`Maaf, error: ${error.message}`, true, '');
                if (window.triggerSpeaking) setTimeout(() => window.triggerSpeaking(false), 2000);
            } finally {
                isProcessing = false;
                const btn = document.getElementById('recordBtn');
                const recordText = document.getElementById('recordText');
                if (btn) btn.classList.remove('recording');
                if (recordText) recordText.textContent = 'MULAI BICARA';
            }
        }
        
        function startVoiceRecognition() {
            if (isProcessing) { updateStatusUI('⏳ Host masih bicara, tunggu sebentar...', true); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { updateStatusUI('❌ Browser tidak support voice recognition', true); return; }
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('recordBtn');
                if (btn) btn.classList.add('recording');
                const recordText = document.getElementById('recordText');
                if (recordText) recordText.textContent = 'MENDENGAR...';
                updateStatusUI('🎤 Silakan bicara...');
            };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                updateStatusUI(`📝 "${text}"`);
                stopVoiceRecognition();
                handleUserSpeech(text);
            };
            recognition.onerror = (event) => { if (event.error !== 'aborted') updateStatusUI(`❌ ${event.error}`, true); stopVoiceRecognition(); };
            recognition.onend = () => { if (isListening) stopVoiceRecognition(); };
            recognition.start();
        }
        
        function stopVoiceRecognition() {
            if (recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }
            isListening = false;
            const btn = document.getElementById('recordBtn');
            if (btn) btn.classList.remove('recording');
            const recordText = document.getElementById('recordText');
            if (recordText) recordText.textContent = 'MULAI BICARA';
        }
        
        function toggleRecording() {
            if (isProcessing) { updateStatusUI('⏳ Tunggu host selesai bicara...', true); return; }
            if (isListening) stopVoiceRecognition();
            else startVoiceRecognition();
        }
        
        document.getElementById('recordBtn')?.addEventListener('click', toggleRecording);
        updateStatusUI('🎤 Upload GLB, lalu klik mikrofon untuk mulai live!');
    </script>
</body>
</html>
