[build]
  publish = "."
  command = "echo 'No build command needed'"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."ai-chat"]
  timeout = 30

# Redirect root ke index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Fallback untuk semua route (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200