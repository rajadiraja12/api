[build]
  publish = "."
  command = "echo 'No build command needed'"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# TIMEOUT DINAIKKAN JADI 30 DETIK
[functions."ai-chat"]
  timeout = 30

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200